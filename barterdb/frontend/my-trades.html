<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Trades - BarterDB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="#">BarterDB</a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="listed_items.html">Items</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="logOut()">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero-section text-center py-4 bg-light">
    <div class="container">
      <h1>My Trades</h1>
      <p>View and manage your sent and received trade offers.</p>
    </div>
  </section>

  <div class="container mt-4">
    <h3 class="text-center">Pending Trades</h3>
    <ul class="list-group" id="activeTradesList"></ul>
  </div>

  <div class="container mt-5">
    <h3 class="text-center">Trade History</h3>
    <ul class="list-group" id="pastTradesList"></ul>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const authToken = localStorage.getItem('authToken');
      const userId = localStorage.getItem('userId');

      if (!authToken || !userId) {
        window.location.href = 'signin.html';
        return;
      }

      fetch(`http://localhost:5001/api/auth/my-trades/${userId}`, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${authToken}`,
          'Content-Type': 'application/json'
        }
      })
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById('activeTradesList');

        data.received.forEach(trade => {
          const li = document.createElement('li');
          li.classList.add('list-group-item');
          li.id = `trade-${trade.id}`;
          li.textContent = `Someone offered ${trade.quantity_offered} x ${trade.offered_item_name} for your ${trade.requested_item_name}`;

          const actions = document.createElement('div');
          actions.classList.add('float-end');

          const acceptBtn = document.createElement('button');
          acceptBtn.className = 'btn btn-success btn-sm mx-1';
          acceptBtn.textContent = 'Accept';
          acceptBtn.onclick = () => acceptTrade(trade.id);

          const declineBtn = document.createElement('button');
          declineBtn.className = 'btn btn-danger btn-sm';
          declineBtn.textContent = 'Decline';
          declineBtn.onclick = () => declineTrade(trade.id);

          actions.appendChild(acceptBtn);
          actions.appendChild(declineBtn);
          li.appendChild(actions);

          list.appendChild(li);
        });

        data.sent.forEach(trade => {
          const li = document.createElement('li');
          li.classList.add('list-group-item');
          li.textContent = `You offered ${trade.quantity_offered} x ${trade.offered_item_name} for ${trade.requested_item_name} — Status: ${trade.status}`;
          list.appendChild(li);
        });
      })
      .catch(err => {
        console.error('Error loading trades:', err);
        alert("Could not load your trades.");
      });

      fetch(`http://localhost:5001/api/auth/past-trades/${userId}`, {
        headers: { 'Authorization': `Bearer ${authToken}` }
      })
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById('pastTradesList');
        if (!data.length) {
          list.innerHTML = `<li class="list-group-item">No past trades found.</li>`;
          return;
        }

        data.forEach(trade => {
          const li = document.createElement('li');
          li.classList.add('list-group-item');
          li.textContent = `You ${trade.status} a trade for ${trade.quantity_requested} x ${trade.requested_item_name} ⇄ ${trade.quantity_offered} x ${trade.offered_item_name} on ${new Date(trade.created_at).toLocaleString()}`;
          list.appendChild(li);
        });
      })
      .catch(err => {
        console.error('Error loading past trades:', err);
      });
    });

    function acceptTrade(tradeId) {
      const authToken = localStorage.getItem('authToken');
      fetch(`http://localhost:5001/api/auth/trade/accept/${tradeId}`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${authToken}`,
          'Content-Type': 'application/json'
        }
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message);
        location.reload();
      })
      .catch(err => {
        console.error('Accept error:', err);
        alert('Failed to accept trade.');
      });
    }

    function declineTrade(tradeId) {
      const authToken = localStorage.getItem('authToken');
      fetch(`http://localhost:5001/api/auth/trade/decline/${tradeId}`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${authToken}`,
          'Content-Type': 'application/json'
        }
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message);
        location.reload();
      })
      .catch(err => {
        console.error('Decline error:', err);
        alert('Failed to decline trade.');
      });
    }

    function logOut() {
      fetch('http://localhost:5001/api/auth/logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(res => res.json())
      .then(data => {
        if (data.message === "Logged out successfully") {
          localStorage.clear();
          window.location.href = 'signin.html';
        }
      })
      .catch(err => {
        console.error('Logout error:', err);
      });
    }
  </script>
</body>
</html>
