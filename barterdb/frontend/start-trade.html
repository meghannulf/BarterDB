<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade - BarterDB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#">BarterDB</a>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero-section text-center py-5 bg-light">
    <div class="container">
      <h1>Start Trading</h1>
      <p>Select what you want and what you're offering to check the match.</p>
    </div>
  </section>

  <!-- Trade Form -->
  <div class="container mt-5">
    <form id="tradeForm">
      <div class="mb-3">
        <label for="productNeeded" class="form-label">Product Needed</label>
        <select class="form-control" id="productNeeded" required>
          <option value="">Select Product Needed</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="itemOffered" class="form-label">Item Offered</label>
        <select class="form-control" id="itemOffered" required>
          <option value="">Select Item Offered</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="quantityOffered" class="form-label">Quantity Offered</label>
        <input type="number" class="form-control" id="quantityOffered" min="1" required />
      </div>

      <button type="submit" class="btn btn-primary">Check Trade</button>
    </form>

    <div id="requiredOfferInfo" class="alert alert-secondary mt-4" style="display: none;"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const authToken = localStorage.getItem('authToken');
      const userId = localStorage.getItem('userId');

      if (!authToken || !userId) {
        alert("You must be logged in to trade.");
        return;
      }

      const productNeededSelect = document.getElementById('productNeeded');
      const itemOfferedSelect = document.getElementById('itemOffered');
      const quantityOfferedInput = document.getElementById('quantityOffered');
      const infoBox = document.getElementById('requiredOfferInfo');

      // Load all items for "Product Needed"
      fetch('http://localhost:5001/api/auth/items')
        .then(res => res.json())
        .then(items => {
          if (!items || items.length === 0) return;
          items.forEach(item => {
            const option = document.createElement('option');
            option.value = item.id;
            option.text = item.name;
            productNeededSelect.appendChild(option);
          });
        })
        .catch(err => {
          console.error('Error loading all items:', err);
          alert("Failed to load product options.");
        });

      // Load user-owned items for "Item Offered"
      fetch(`http://localhost:5001/api/auth/items/user/${userId}`, {
        headers: { 'Authorization': `Bearer ${authToken}` }
      })
        .then(res => res.json())
        .then(data => {
          const items = data.items;
          itemOfferedSelect.innerHTML = '<option value="">Select Item Offered</option>';
          if (!items || items.length === 0) return;
          items.forEach(item => {
            const option = document.createElement('option');
            option.value = item.id;
            option.text = item.name;
            itemOfferedSelect.appendChild(option);
          });
        })
        .catch(err => {
          console.error('Error loading user items:', err);
          alert("Failed to load your items.");
        });

      function calculateRequiredOffer() {
        const productNeeded = productNeededSelect.value;
        const itemOffered = itemOfferedSelect.value;
        const amountNeeded = 1;

        if (!productNeeded || !itemOffered) {
          infoBox.style.display = 'none';
          return;
        }

        fetch('http://localhost:5001/api/auth/match', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({
            productNeeded: Number(productNeeded),
            itemOffered: Number(itemOffered),
            amountNeeded: 1,
            amountOffered: 0
          }),
          })
          .then(res => res.json())
          .then(data => {
            if (data.requiredOffer) {
              quantityOfferedInput.value = data.requiredOffer.toFixed(2);
              infoBox.style.display = 'block';
              infoBox.textContent = `To get 1 unit of that item, you must offer at least ${data.requiredOffer.toFixed(2)} unit(s).`;
            } else if (data.message) {
              infoBox.style.display = 'block';
              infoBox.textContent = `No match found: ${data.message}`;
              quantityOfferedInput.value = '';
            }
          })
          .catch(err => {
            console.warn("Match preview failed:", err);
            infoBox.style.display = 'none';
          });
      }

      productNeededSelect.addEventListener('change', calculateRequiredOffer);
      itemOfferedSelect.addEventListener('change', calculateRequiredOffer);

      document.getElementById('tradeForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const tradeData = {
          productNeeded: Number(productNeededSelect.value),
          itemOffered: Number(itemOfferedSelect.value),
          amountNeeded: 1,
          amountOffered: parseFloat(quantityOfferedInput.value),
        };

        fetch('http://localhost:5001/api/auth/match', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify(tradeData),
        })
        .then(async (response) => {
        const data = await response.json();

        if (!response.ok) {
          // ❌ Server returned 400/500 — show error from backend
          alert(`❌ Trade failed: ${data.message}`);
          return;
        }

        // ✅ Server returned 200
        if (data.requiredOffer) {
          // Proceed to actually initiate the trade
          fetch('http://localhost:5001/api/auth/trade/initiate', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({
              productNeeded: tradeData.productNeeded,
              itemOffered: tradeData.itemOffered,
              amountNeeded: tradeData.amountNeeded,
              amountOffered: tradeData.amountOffered
            })
          })
          .then(res => res.json())
          .then(initData => {
            if (initData.tradeId) {
              alert(`✅ Trade offer sent to item owner! Trade ID: ${initData.tradeId}`);
              window.location.href = 'my-dashboard.html'; // Or wherever you want to redirect
            } else {
              alert(`❌ Failed to create trade: ${initData.message}`);
            }
          })
          .catch(err => {
            console.error("Trade submission error:", err);
            alert("An error occurred while submitting the trade.");
          });
        }
      })
      .catch((err) => {
        console.error('Error submitting trade:', err);
        alert("An error occurred while submitting the trade.");
      });
      });
    });
  </script>
</body>
</html>
