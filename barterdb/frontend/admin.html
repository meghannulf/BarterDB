<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - BarterDB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">BarterDB</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
        <li class="nav-item"><a class="nav-link" href="signin.html">Sign In</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="logOut()">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="text-center mb-4">All Trades (Admin View)</h2>
    <div id="loadingSpinner" class="text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p>Loading trades...</p>
    </div>
    <ul id="tradeList" class="list-group"></ul>

    <hr class="my-5"/>

    <h2 class="text-center mb-4">All Users</h2>
    <div id="userList" class="row"></div>

    <hr class="my-5"/>

    <h2 class="text-center mb-4">All Items</h2>
    <div id="itemList" class="row"></div>
  </div>

  <footer class="text-center py-3 bg-dark text-white mt-4">
    <p>&copy; 2025 BarterDB. All Rights Reserved.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const authToken = localStorage.getItem('authToken');
      if (!authToken) {
        alert('You must be logged in as an admin to access this page.');
        window.location.href = 'signin.html';
        return;
      }
      const decodedToken = JSON.parse(atob(authToken.split('.')[1]));
      if (!decodedToken.is_admin) {
        alert('Admin access only.');
        window.location.href = 'index.html';
        return;
      }

      fetch('http://localhost:5001/api/auth/admin-trades', {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${authToken}`,
          'Content-Type': 'application/json'
        }
      })
      .then(res => res.json())
      .then(trades => {
        document.getElementById('loadingSpinner').style.display = 'none';
        const list = document.getElementById('tradeList');

        if (!Array.isArray(trades) || trades.length === 0) {
          list.innerHTML = '<li class="list-group-item text-center">No trades found.</li>';
          return;
        }

        trades.forEach(trade => {
          const li = document.createElement('li');
          li.className = 'list-group-item';
          li.innerHTML = `
            <strong>Trade ID:</strong> ${trade.id} — 
            <strong>Status:</strong> ${trade.status} — 
            <strong>Offered:</strong> ${trade.quantity_offered} x ${trade.offered_item_name} 
            <strong>For:</strong> ${trade.quantity_requested} x ${trade.requested_item_name} 
            <em>(From user ${trade.requester_id} to user ${trade.owner_id})</em>
          `;
          list.appendChild(li);
        });
      })
      .catch(err => {
        console.error('Failed to load trades:', err);
        document.getElementById('loadingSpinner').innerHTML = '<p class="text-danger">Failed to load trades.</p>';
      });

      // Fetch all users
      fetch('http://localhost:5001/api/auth/users')
        .then(res => res.json())
        .then(users => {
          const userList = document.getElementById('userList');
          users.forEach(user => {
            const card = document.createElement('div');
            card.className = 'col-md-4';
            card.innerHTML = `
              <div class="card mb-3">
                <div class="card-body">
                  <h5 class="card-title">${user.name}</h5>
                  <p class="card-text">${user.email}</p>
                  <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})">Delete User</button>
                </div>
              </div>
            `;
            userList.appendChild(card);
          });
        });

      // Fetch all items
      fetch('http://localhost:5001/api/auth/items')
        .then(res => res.json())
        .then(items => {
          const itemList = document.getElementById('itemList');
          items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'col-md-4';
            card.innerHTML = `
              <div class="card mb-3">
                <div class="card-body">
                  <h5 class="card-title">${item.name}</h5>
                  <p class="card-text">${item.description}</p>
                  <p class="card-text">Quantity: ${item.available_quantity}</p>
                  <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id})">Delete Item</button>
                </div>
              </div>
            `;
            itemList.appendChild(card);
          });
        });
    });

    function deleteItem(id) {
      const authToken = localStorage.getItem('authToken');
      fetch(`http://localhost:5001/api/auth/items/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${authToken}` }
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message);
        location.reload();
      });
    }

    function deleteUser(id) {
      const authToken = localStorage.getItem('authToken');
      fetch(`http://localhost:5001/api/auth/users/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${authToken}` }
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message);
        location.reload();
      });
    }

    function logOut() {
      localStorage.removeItem('authToken');
      window.location.href = 'signin.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
